<tr>
    <td class="content">
        <h2>Hello {{name}},</h2>
        <p>Use the following code to complete your login to the <strong>DUCC Website</strong>. This code will expire in 10 minutes.</p>
        
        <div style="background-color: #f9fafb; padding: 32px; border-radius: 12px; border: 1px dashed #e5e7eb; margin: 32px 0; text-align: center;">
            <span style="font-family: 'Courier New', Courier, monospace; font-size: 36px; font-weight: 700; color: #7E317B; letter-spacing: 8px;">{{otp}}</span>
        </div>

        <p>If you didn't request this code, you can safely ignore this email.</p>
        
        <p style="margin-top: 32px; font-size: 14px; color: #6b7280;">
            For your security, never share this code with anyone.
        </p>
    </td>
</tr>
