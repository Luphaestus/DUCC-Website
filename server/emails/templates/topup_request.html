<tr>
    <td class="content">
        <h2>New Top-Up Request</h2>
        <p>A user has submitted a new top-up request that requires verification.</p>
        <p><strong>User:</strong> {{user_name}} ({{user_email}})</p>
        <p><strong>Amount:</strong> £{{amount}}</p>
        <p><strong>Description:</strong> {{description}}</p>
        <p>Please verify the bank transfer and confirm the transaction in the admin panel.</p>
        <div class="button-container">
            <a href="https://{{domain}}/admin/user/{{user_id}}" class="button">View User Profile</a>
        </div>
    </td>
</tr>
