<tr>
    <td class="content">
        <h2>Hi {{name}},</h2>
        <p>You have a new notification from <strong>Durham University Canoe Club</strong>:</p>
        
        <div style="background-color: #f9fafb; padding: 24px; border-radius: 12px; border-left: 4px solid #006388; margin: 24px 0;">
            <h3 style="margin: 0 0 8px; color: #111827; font-size: 18px;">{{title}}</h3>
            <p style="margin: 0; color: #4b5563; font-size: 15px;">{{body}}</p>
        </div>

        <table width="100%">
            <tr>
                <td class="button-container">
                    <a href="https://durhamunicanoe.co.uk{{url}}" class="button">View Details</a>
                </td>
            </tr>
        </table>
        
        <p style="margin-top: 32px; font-size: 14px; color: #6b7280;">
            You can manage your notification preferences in your profile settings.
        </p>
    </td>
</tr>
