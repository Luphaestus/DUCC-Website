services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: ducc_website
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_ROOT_HOST: '%'
      MYSQL_USER: ducc_user
      MYSQL_PASSWORD: ducc_password
    ports:
      - "3306:3306"
    volumes:
      - db_data_v2:/var/lib/mysql
      - ./server/db/init-scripts:/docker-entrypoint-initdb.d

  app:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:3000:3000"
    expose:
      - "3000"
    volumes:
      - ./data:/app/data
    restart: always
    environment:
      - NODE_ENV=${NODE_ENV:-prod}
      - DOCKER=true
      - DB_HOST=db
      - DB_USER=ducc_user
      - DB_PASSWORD=ducc_password
      - DB_ROOT_PASSWORD=root_password
      - DB_NAME=ducc_website
      - DB_PORT=3306
      - SESSION_SECRET=${SESSION_SECRET:-dev-secret-key}
      - DOMAIN_NAME=${DOMAIN_NAME}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
      - EMAIL_TEST_DESTINATION=${EMAIL_TEST_DESTINATION}
      - GMAIL_CLIENT_ID=${GMAIL_CLIENT_ID}
      - GMAIL_CLIENT_SECRET=${GMAIL_CLIENT_SECRET}
      - GMAIL_REFRESH_TOKEN=${GMAIL_REFRESH_TOKEN}
    depends_on:
      - db

  caddy:
    image: caddy:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME:-localhost}
      - SERVER_IP=${SERVER_IP}
    depends_on:
      - app

volumes:
  db_data_v2:
  caddy_data:
  caddy_config: